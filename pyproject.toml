[project]
name = "fuel-route-optimizer"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C4", "RET", "PL", "ANN", "ERA"]
ignore = ["PLR2004", "PLR0913", "ANN401", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004"]
"config/settings/*.py" = ["F403", "F405"]
"manage.py" = ["PLC0415"]
"scripts/*.py" = ["E402", "T201"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["apps"]
omit = ["apps/*/migrations/*"]
